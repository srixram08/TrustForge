services:
  # Option 1: Unified Full-Stack Web Service (Recommended for Free Tier)
  - type: web
    name: trustforge-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
